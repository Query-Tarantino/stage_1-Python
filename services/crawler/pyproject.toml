[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tarantino-crawler"
version = "1.0.0"
description = "Query Tarantino crawler: downloads Project Gutenberg books, splits them and stores them in the datalake"
requires-python = ">=3.13"
dependencies = [
    "truststore>=0.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
