[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tarantino-query"
version = "1.0.0"
description = "Query Tarantino query service: searches the datamarts"
requires-python = ">=3.13"
dependencies = [
    "pymongo>=4.6.0",
    "regex>=2023.8.8",
]

[tool.setuptools.packages.find]
where = ["src"]
